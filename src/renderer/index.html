<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MonsterDeleter</title>
  </head>
  <body>
    <main id="stage" aria-label="大将怪兽文件删除动画">
      <div id="background-layer" class="background-layer"></div>
      <div class="vignette"></div>

      <section id="instruction" class="instruction" aria-live="polite">
        <span class="instruction-kicker">TARGET LOCK</span>
        <strong id="instruction-title">请选择要摧毁的位置</strong>
        <span id="instruction-detail">按 Esc 随时退出</span>
      </section>

      <div id="reticle" class="reticle" aria-hidden="true">
        <span class="reticle-core"></span>
      </div>

      <canvas id="monster-canvas" class="sprite-canvas" hidden></canvas>
      <canvas id="explosion-canvas" class="sprite-canvas explosion" hidden></canvas>

      <section id="bubble" class="bubble" hidden>
        <span>喂，是这个吗？</span>
      </section>

      <section id="choices" class="choices" hidden aria-label="确认摧毁">
        <button id="confirm-primary" type="button">是的</button>
        <button id="confirm-secondary" type="button">嘿嘿嘿，就是这个</button>
      </section>

      <section id="status" class="status" hidden aria-live="assertive"></section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
